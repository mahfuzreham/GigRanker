name: Security Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer dependency audit
        run: composer audit --no-interaction --format=plain

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find app bootstrap config database public routes -type f -name '*.php' -print0)

      - name: Check tracked files for common secret assignments
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(OPENAI_API_KEY|GEMINI_API_KEY|GROQ_API_KEY|BKASH_APP_SECRET|BKASH_PASSWORD|PRIVATE_KEY|BINANCE_SECRET|BEP20_PRIVATE_KEY)[[:space:]]*=[[:space:]]*[^$[:space:]]' -- ':!SECURITY.md' ':!.env.example'; then
            echo 'Potential hard-coded secret detected.'
            exit 1
          fi

      - name: Verify environment files are ignored
        shell: bash
        run: |
          set -euo pipefail
          git check-ignore .env
          ! git ls-files --error-unmatch .env >/dev/null 2>&1
