name: Application Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, openssl, pdo, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, ctype, curl, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction --locked

      - name: Check every PHP file for syntax errors
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './storage/*' \
            -not -path './bootstrap/cache/*' -print0)

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Boot Laravel and list routes
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan about --only=environment
          php artisan route:list --except-vendor

      - name: Check Artisan commands
        run: |
          php artisan list --format=txt | grep -F 'gigranker:deployment'
          php artisan list --format=txt | grep -F 'gigranker:rollback'
          php artisan list --format=txt | grep -F 'gigranker:backup'
          php artisan list --format=txt | grep -F 'gigranker:health'

      - name: Run application tests
        run: php artisan test --without-tty
